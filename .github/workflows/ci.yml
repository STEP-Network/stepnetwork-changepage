name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Contract version sync between src/stub.js and docs/02-contract.md, plus relative-link
      # integrity across every markdown file. Zero dependencies, so no install step.
      - run: node scripts/check-docs.mjs
